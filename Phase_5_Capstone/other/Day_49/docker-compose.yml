services:
  portfolio-hub:
    build:
      context: ../../../
      dockerfile: Phase_5_Capstone/other/Day_49/Dockerfile

    container_name: day_49_beast

    ports:
      - "8000:8000"

    volumes:
      - ../../../:/app

    environment:
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docker/status"]
      interval: 30s
      timeout: 10s
      retries: 3